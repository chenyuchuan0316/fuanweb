      };

      const refs = {
        search: document.getElementById('q'),
        groups: document.getElementById('groups'),
        mapView: document.getElementById('mapView'),
        viewList: document.getElementById('viewList'),
        viewMap: document.getElementById('viewMap'),
        stats: document.getElementById('stats'),
        statCount: document.getElementById('statCount'),
        statAreas: document.getElementById('statAreas'),
        empty: document.getElementById('empty'),
        suggestion: document.getElementById('suggestion'),
        suggestionLink: document.getElementById('suggestion-link'),
        emptySupport: document.getElementById('empty-support'),
        liveRegion: document.getElementById('liveRegion'),
        favoritesSection: document.getElementById('favorites-section'),
        favoritesList: document.getElementById('favorites-list'),
        favoritesCount: document.getElementById('favorites-count'),
        serviceChips: document.getElementById('service-chips'),
        areaChips: document.getElementById('area-chips'),
        themeToggle: document.getElementById('themeToggle')
      };

      const serviceControls = new Map();
      const areaControls = new Map();

      const favorites = loadFavorites();
      const state = {
        query: '',
        services: new Set(),
        areas: new Set(),
        view: 'list',
        results: [],
        favorites
      };

      const enhancedUnits = (Array.isArray(window.UNITS) ? window.UNITS : []).map(enhanceUnit);
      const allAreaBases = Array.from(new Set(enhancedUnits.flatMap(unit => unit.areaBases))).sort((a, b) => a.localeCompare(b, 'zh-Hant'));

      let mapInstance = null;
      let markerLayer = null;

      initTheme();
      initSearch();
      initPills();
      initChips();
      initViewToggle();
      initSuggestionLinks();
      renderFavorites();
      applyFilters();

      function enhanceUnit(unit){
        const serviceCode = SERVICE_CODE[unit.service] || unit.service || '';
        const serviceLabel = SERVICE_LABEL[serviceCode] || serviceCode || '';
        const areaNames = Array.isArray(unit.areas) ? unit.areas.filter(Boolean) : [];
        const areaBases = Array.from(new Set(areaNames.map(a => {
          const trimmed = (a || '').trim();
          if (!trimmed) return '';
          return trimmed.endsWith('區') ? trimmed.slice(0, -1) : trimmed;
        }).filter(Boolean)));
        const tags = Array.isArray(unit.tags) ? unit.tags.filter(Boolean) : unit.tags ? [unit.tags] : [];
        const lat = unit.lat === 0 ? 0 : Number(unit.lat);
        const lng = unit.lng === 0 ? 0 : Number(unit.lng);
        const latLng = Number.isFinite(lat) && Number.isFinite(lng) ? { lat, lng } : null;
        const searchParts = [
          unit.display,
          unit.name,
          unit.code,
          unit.address,
          areaNames.join(' '),
          areaBases.join(' '),
          tags.join(' '),
          serviceLabel
        ];
        return Object.assign({}, unit, {
          serviceCode,
          serviceLabel,
          areaNames,
          areaBases,
          tags,
          latLng,
          hasLine: Boolean((unit.line_id || '').trim()),
          searchText: searchParts.filter(Boolean).map(normalize).join(' ')
        });
      }

      function normalize(value){
        return (value || '').toString().toLowerCase().replace(/\s+/g, ' ').trim();
      }

      function loadFavorites(){
        try {
          const raw = window.localStorage.getItem(STORAGE_KEYS.favorites);
          if (!raw) return new Set();
          const parsed = JSON.parse(raw);
          return new Set(Array.isArray(parsed) ? parsed : []);
        } catch (err) {
          return new Set();
        }
      }

      function saveFavorites(){
        try {
          const list = Array.from(state.favorites);
          window.localStorage.setItem(STORAGE_KEYS.favorites, JSON.stringify(list));
        } catch (err) {
          // ignore write errors
        }
      }

      function initTheme(){
        const root = document.documentElement;
        const saved = (() => {
          try { return window.localStorage.getItem(STORAGE_KEYS.theme); } catch (err) { return null; }
        })();
        if (saved === 'dark') {
          root.setAttribute('data-theme', 'dark');
        }
        updateThemeToggle();
        if (refs.themeToggle) {
          refs.themeToggle.addEventListener('click', () => {
            const isDark = root.getAttribute('data-theme') === 'dark';
            if (isDark) {
              root.removeAttribute('data-theme');
              try { window.localStorage.setItem(STORAGE_KEYS.theme, 'light'); } catch (err) {}
            } else {
              root.setAttribute('data-theme', 'dark');
              try { window.localStorage.setItem(STORAGE_KEYS.theme, 'dark'); } catch (err) {}
            }
            updateThemeToggle();
          });
        }
      }

      function updateThemeToggle(){
        if (!refs.themeToggle) return;
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        refs.themeToggle.setAttribute('aria-pressed', isDark ? 'true' : 'false');
        refs.themeToggle.textContent = isDark ? '🌞 淺色模式' : '🌙 深色模式';
        refs.themeToggle.setAttribute('aria-label', isDark ? '切換為淺色模式' : '切換為深色模式');
      }

      function initSearch(){
        if (!refs.search) return;
        state.query = normalize(refs.search.value);
        refs.search.addEventListener('input', () => {
          state.query = normalize(refs.search.value);
          applyFilters();
        });
      }

      function initPills(){
        const pills = Array.from(document.querySelectorAll('.pill[data-s]'));
        pills.forEach(pill => {
          const code = pill.dataset.s;
          if (!code) return;
          registerServiceControl(code, pill);
          pill.addEventListener('click', () => {
            toggleService(code);
            if (refs.groups) {
              refs.groups.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          });
        });
      }

      function initChips(){
        if (refs.serviceChips) {
          SERVICE_ORDER.forEach(code => {
            const label = SERVICE_LABEL[code] || code;
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'chip';
            btn.textContent = label;
            btn.setAttribute('aria-pressed', 'false');
            registerServiceControl(code, btn);
            btn.addEventListener('click', () => toggleService(code));
            refs.serviceChips.appendChild(btn);
          });
        }
        if (refs.areaChips) {
          allAreaBases.forEach(area => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'chip';
            btn.textContent = area;
            btn.setAttribute('aria-pressed', 'false');
            registerAreaControl(area, btn);
            btn.addEventListener('click', () => toggleArea(area));
            refs.areaChips.appendChild(btn);
          });
        }
      }

      function initViewToggle(){
        if (refs.viewList) {
          refs.viewList.addEventListener('click', () => setView('list'));
        }
        if (refs.viewMap) {
          refs.viewMap.addEventListener('click', () => setView('map'));
        }
        updateViewControls();
      }

      function initSuggestionLinks(){
        const academyUrl = withUTM('https://line.me/R/ti/p/%40817igqdq');
        if (refs.suggestionLink) {
          refs.suggestionLink.href = academyUrl;
        }
        if (refs.emptySupport) {
          refs.emptySupport.href = academyUrl;
        }
      }

      function registerServiceControl(code, el){
        if (!serviceControls.has(code)) {
          serviceControls.set(code, []);
        }
        serviceControls.get(code).push(el);
      }

      function registerAreaControl(area, el){
        if (!areaControls.has(area)) {
          areaControls.set(area, []);
        }
        areaControls.get(area).push(el);
      }

      function toggleService(code){
        if (state.services.has(code)) {
          state.services.delete(code);
        } else {
          state.services.add(code);
        }
        syncServiceControls(code);
        applyFilters();
      }

      function toggleArea(area){
        if (state.areas.has(area)) {
          state.areas.delete(area);
        } else {
          state.areas.add(area);
        }
        syncAreaControls(area);
        applyFilters();
      }

      function syncServiceControls(code){
        const isActive = state.services.has(code);
        const controls = serviceControls.get(code) || [];
        controls.forEach(el => {
          el.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });
      }

      function syncAreaControls(area){
        const isActive = state.areas.has(area);
        const controls = areaControls.get(area) || [];
        controls.forEach(el => {
          el.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });
      }

      function setView(view){
        if (state.view === view) return;
        state.view = view;
        updateViewControls();
        updateViewVisibility();
        if (view === 'map') {
          renderMap(state.results);
        }
      }

      function updateViewControls(){
        if (refs.viewList) {
          refs.viewList.setAttribute('aria-pressed', state.view === 'list' ? 'true' : 'false');
        }
        if (refs.viewMap) {
          refs.viewMap.setAttribute('aria-pressed', state.view === 'map' ? 'true' : 'false');
        }
        updateViewVisibility();
      }

      function updateViewVisibility(){
        if (refs.groups) {
          refs.groups.classList.toggle('hidden', state.view === 'map');
        }
        if (refs.mapView) {
          if (state.view === 'map') {
            refs.mapView.removeAttribute('hidden');
            if (mapInstance) {
              setTimeout(() => mapInstance.invalidateSize(), 120);
            }
          } else {
            refs.mapView.setAttribute('hidden', '');
          }
        }
      }

      function applyFilters(){
        let filtered = enhancedUnits.filter(unit => {
          if (state.services.size && !state.services.has(unit.serviceCode)) {
            return false;
          }
          if (state.areas.size) {
            const hasArea = unit.areaBases.some(area => state.areas.has(area));
            if (!hasArea) return false;
          }
          if (state.query) {
            return unit.searchText.includes(state.query);
          }
          return true;
        });
        filtered.sort(sortUnits);
        state.results = filtered;
        renderGroups(filtered);
        if (state.view === 'map') {
          renderMap(filtered);
        }
        updateStats(filtered);
        updateSuggestion(filtered);
        updateEmptyState(filtered);
        updateLiveRegion(filtered);
      }

      function sortUnits(a, b){
        if (a.hasLine !== b.hasLine) {
          return a.hasLine ? -1 : 1;
        }
        return (a.code || '').localeCompare(b.code || '', 'zh-Hant-u-nu-latn', { numeric: true, sensitivity: 'base' });
      }

      function renderGroups(units){
        if (!refs.groups) return;
        refs.groups.innerHTML = '';
        SERVICE_ORDER.forEach(code => {
          const groupUnits = units.filter(unit => unit.serviceCode === code);
          if (!groupUnits.length) return;
          const section = document.createElement('section');
          section.className = 'group';
          const heading = document.createElement('h2');
          heading.textContent = `${SERVICE_LABEL[code] || code}（${groupUnits.length}）`;
          section.appendChild(heading);
          const grid = document.createElement('div');
          grid.className = 'grid';
          groupUnits.forEach(unit => {
            grid.appendChild(createCard(unit));
          });
          section.appendChild(grid);
          refs.groups.appendChild(section);
        });
      }

      function createCard(unit){
        const card = document.createElement('article');
        card.className = 'card';
        card.setAttribute('data-code', unit.code);

        const titleWrap = document.createElement('div');
        titleWrap.className = 'title';
        const h3 = document.createElement('h3');
        h3.textContent = unit.display || unit.name || unit.code;
        const code = document.createElement('span');
        code.className = 'code';
        code.textContent = unit.code;
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = unit.serviceLabel || '';
        titleWrap.appendChild(h3);
        titleWrap.appendChild(code);
        titleWrap.appendChild(badge);

        const actions = document.createElement('div');
        actions.className = 'card-actions';
        const isEmployeeOnly = unit.tags.some(tag => /員工/.test(tag)) || unit.code === 'MAN1';
        const hasLine = unit.hasLine && !isEmployeeOnly;
        const lineUrl = hasLine ? withUTM(`https://line.me/R/ti/p/%40${(unit.line_id || '').trim()}`) : '';
        const callUrl = unit.tel ? buildTel(unit.tel) : '';
        const navUrl = buildNavUrl(unit);

        actions.appendChild(createActionLink({
          className: 'btn-line',
          label: hasLine ? '加入 LINE ↗' : '員工專用',
          href: lineUrl,
          disabled: !hasLine,
          newTab: true
        }));
        actions.appendChild(createActionLink({
          className: 'btn-call',
          label: unit.tel ? '撥打電話' : '電話暫缺',
          href: callUrl,
          disabled: !unit.tel
        }));
        actions.appendChild(createActionLink({
          className: 'btn-nav',
          label: navUrl ? '地圖導航' : '地址暫缺',
          href: navUrl,
          disabled: !navUrl,
          newTab: Boolean(navUrl)
        }));

        const meta = document.createElement('div');
        meta.className = 'meta';
        const areas = unit.areaNames.length ? Array.from(new Set(unit.areaNames.map(name => name.endsWith('區') ? name : `${name}區`))).join('、') : '未提供';
        const deptExt = unit.dept_ext ? `代表號：${unit.dept_ext}` : '';
        const unitExt = unit.unit_ext ? `單位分機：${unit.unit_ext}` : '';
        const phoneInfo = [deptExt, unitExt].filter(Boolean).join('｜');

        const areaSpan = document.createElement('span');
        areaSpan.textContent = `服務區域：${areas}`;
        meta.appendChild(areaSpan);

        const phoneSpan = document.createElement('span');
        if (unit.tel) {
          phoneSpan.append('電話：');
          const telAnchor = document.createElement('a');
          telAnchor.href = callUrl;
          telAnchor.textContent = unit.tel;
          phoneSpan.appendChild(telAnchor);
          if (phoneInfo) {
            phoneSpan.append(`（${phoneInfo}）`);
          }
        } else {
          phoneSpan.textContent = '電話：未提供';
        }
        meta.appendChild(phoneSpan);

        const addressSpan = document.createElement('span');
        addressSpan.textContent = `地址：${unit.address || '未提供'}`;
        meta.appendChild(addressSpan);

        const note = document.createElement('div');
        note.className = 'smallnote';
        note.textContent = '實際服務以各單位公告為準。';

        const favBtn = document.createElement('button');
        favBtn.type = 'button';
        favBtn.className = 'fav-btn';
        favBtn.setAttribute('aria-label', state.favorites.has(unit.code) ? '從收藏移除' : '加入收藏');
        favBtn.setAttribute('aria-pressed', state.favorites.has(unit.code) ? 'true' : 'false');
        favBtn.textContent = state.favorites.has(unit.code) ? '★' : '☆';
        favBtn.addEventListener('click', () => toggleFavorite(unit));

        card.appendChild(titleWrap);
        card.appendChild(actions);
        card.appendChild(meta);
        card.appendChild(note);
        card.appendChild(favBtn);

        return card;
      }

      function buildTel(tel){
        return `tel:${(tel || '').replace(/[^0-9+]/g, '')}`;
      }

      function buildNavUrl(unit){
        if (unit.latLng) {
          const { lat, lng } = unit.latLng;
          return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(`${lat},${lng}`)}`;
        }
        if (unit.address) {
          return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(unit.address)}`;
        }
        return '';
      }

      function createActionLink(options){
        const { className, label, href, disabled, newTab } = options;
        const el = document.createElement('a');
        el.className = `btn ${className}`;
        el.textContent = label;
        if (disabled) {
          el.classList.add('is-off');
          el.setAttribute('aria-disabled', 'true');
          el.tabIndex = -1;
        } else {
          el.href = href;
          if (newTab) {
            el.target = '_blank';
            el.rel = 'noopener';
          }
        }
        return el;
      }

      function toggleFavorite(unit){
        const code = unit.code;
        if (state.favorites.has(code)) {
          state.favorites.delete(code);
        } else {
          state.favorites.add(code);
        }
        saveFavorites();
        renderFavorites();
        renderGroups(state.results);
      }

      function renderFavorites(){
        if (!refs.favoritesSection || !refs.favoritesList) return;
        const favUnits = enhancedUnits.filter(unit => state.favorites.has(unit.code));
        if (!favUnits.length) {
          refs.favoritesSection.hidden = true;
          if (refs.favoritesCount) {
            refs.favoritesCount.textContent = '0';
          }
          return;
        }
        refs.favoritesSection.hidden = false;
        refs.favoritesList.innerHTML = '';
        favUnits.sort(sortUnits).forEach(unit => {
          refs.favoritesList.appendChild(createCard(unit));
        });
        if (refs.favoritesCount) {
          refs.favoritesCount.textContent = String(favUnits.length);
        }
      }

      function renderMap(units){
        if (!refs.mapView || typeof L === 'undefined') return;
        if (!mapInstance) {
          mapInstance = L.map(refs.mapView, { scrollWheelZoom: false });
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap 貢獻者'
          }).addTo(mapInstance);
          markerLayer = L.layerGroup().addTo(mapInstance);
        }
        markerLayer.clearLayers();
        const boundsPoints = [];
        units.forEach(unit => {
          if (!unit.latLng) return;
          const marker = L.marker([unit.latLng.lat, unit.latLng.lng]);
          marker.bindPopup(createPopup(unit));
          markerLayer.addLayer(marker);
          boundsPoints.push([unit.latLng.lat, unit.latLng.lng]);
        });
        if (boundsPoints.length === 1) {
          mapInstance.setView(boundsPoints[0], 16);
        } else if (boundsPoints.length > 1) {
          const bounds = L.latLngBounds(boundsPoints);
          mapInstance.fitBounds(bounds.pad(0.12));
        } else {
          mapInstance.setView(MAP_DEFAULT.center, MAP_DEFAULT.zoom);
        }
        if (state.view === 'map') {
          setTimeout(() => mapInstance.invalidateSize(), 120);
        }
      }

      function createPopup(unit){
        const container = document.createElement('div');
        container.className = 'map-popup';
        const title = document.createElement('strong');
        title.textContent = unit.display || unit.name || unit.code;
        container.appendChild(title);
        if (unit.address) {
          const addr = document.createElement('div');
          addr.textContent = unit.address;
          container.appendChild(addr);
        }
        const actions = document.createElement('div');
        actions.className = 'popup-actions';
        const isEmployeeOnly = unit.tags.some(tag => /員工/.test(tag)) || unit.code === 'MAN1';
        const hasLine = unit.hasLine && !isEmployeeOnly;
        actions.appendChild(createActionLink({
          className: 'btn-line',
          label: hasLine ? '加入 LINE ↗' : '員工專用',
          href: hasLine ? withUTM(`https://line.me/R/ti/p/%40${(unit.line_id || '').trim()}`) : '',
          disabled: !hasLine,
          newTab: true
        }));
        actions.appendChild(createActionLink({
          className: 'btn-call',
          label: unit.tel ? '撥打電話' : '電話暫缺',
          href: unit.tel ? buildTel(unit.tel) : '',
          disabled: !unit.tel
        }));
        const navUrl = buildNavUrl(unit);
        actions.appendChild(createActionLink({
          className: 'btn-nav',
          label: navUrl ? '地圖導航' : '地址暫缺',
          href: navUrl,
          disabled: !navUrl,
          newTab: Boolean(navUrl)
        }));
        container.appendChild(actions);
        return container;
      }

      function updateStats(units){
        if (!refs.statCount || !refs.statAreas) return;
        refs.statCount.textContent = `共 ${units.length} 個單位`;
        const areas = state.areas.size ? Array.from(state.areas).join('、') : '全部';
        refs.statAreas.textContent = `地區：${areas}`;
      }

      function updateSuggestion(units){
        if (!refs.suggestion) return;
        if (units.length <= 2) {
          refs.suggestion.hidden = false;
        } else {
          refs.suggestion.hidden = true;
        }
      }

      function updateEmptyState(units){
        if (!refs.empty) return;
        if (!units.length) {
          refs.empty.hidden = false;
        } else {
          refs.empty.hidden = true;
        }
      }

      function updateLiveRegion(units){
        if (!refs.liveRegion) return;
        const areaText = state.areas.size ? `，已選地區：${Array.from(state.areas).join('、')}` : '';
        refs.liveRegion.textContent = `共 ${units.length} 個符合條件的單位${areaText}`;
      }
    })();
  </script>
</body>
</html>
